<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Mobile Style - Vertical */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .image-display {
                width: 100vw;
                height: 85vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            .image-display img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .controls {
                width: 100%;
                height: 15vh;
                display: flex;
                gap: 10px;
                align-items: center;
                justify-content: center;
                padding: 10px;
            }

            .controls button {
                padding: 12px 24px;
                font-size: 16px;
            }

            .navigation-container {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 500px;
            }
        }

        /* Desktop Style - Horizontal */
        @media (min-width: 769px) {
            .container {
                flex-direction: row;
            }

            .image-display {
                flex: 1;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            .image-display img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .controls {
                width: 300px;
                height: 100vh;
                display: flex;
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                justify-content: flex-start;
                padding: 20px;
                background: #1a1a1a;
                overflow-y: auto;
            }

            .controls button {
                width: 100%;
                padding: 10px;
                font-size: 14px;
            }

            .navigation-container {
                position: absolute;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
            }
        }

        .image-display {
            background: #000;
        }

        .info {
            color: #fff;
            padding: 10px;
            text-align: center;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #0052a3;
        }

        button:active {
            transform: scale(0.98);
        }

        .thumbnail-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .thumbnail-list img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .thumbnail-list img.active {
            opacity: 1;
            border: 2px solid #0066cc;
        }

        .thumbnail-list img:hover {
            opacity: 0.8;
        }

        /* Navigation Container Styles */
        .navigation-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            backdrop-filter: blur(8px);
        }

        .nav-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 102, 204, 0.8);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            padding: 0;
        }

        .nav-button:hover:not(:disabled) {
            background: rgba(0, 102, 204, 1);
            transform: scale(1.1);
        }

        .nav-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .nav-button:disabled {
            background: rgba(100, 100, 100, 0.4);
            cursor: not-allowed;
            opacity: 0.3;
        }

        .step-description {
            color: #fff;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-display">
            <img id="mainImage" src="https://via.placeholder.com/800x600" alt="Image">
            <!-- Navigation Container -->
            <div class="navigation-container">
                <button id="prevBtn" class="nav-button" onclick="prevImage()" title="Image précédente">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="step-description" id="stepDescription">Étape 1</div>
                <button id="nextBtn" class="nav-button" onclick="nextImage()" title="Image suivante">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <div class="controls">
            <div class="info">
                <p id="counter">1 / 1</p>
            </div>
            <div class="thumbnail-list" id="thumbnails"></div>
        </div>
    </div>

    <script>
        let images = [];
        let stepDescriptions = [];
        let tutorialTitle = '';

        function getStepVisual(step) {
            return (
                step.image ||
                step.imageUrl ||
                step.image_url ||
                step.finalImageUrl ||
                step.final_image_url ||
                step.svg ||
                step.svgUrl ||
                step.svg_url ||
                'https://via.placeholder.com/800x600?text=Étape'
            );
        }

        // Charger les données du tutoriel depuis localStorage
        function loadTutorialData() {
            const tutorialData = localStorage.getItem('kelasi_tutorial_data');
            
            if (tutorialData) {
                try {
                    const tutorial = JSON.parse(tutorialData);
                    tutorialTitle = tutorial.title || 'Tutoriel';
                    document.title = tutorialTitle;
                    document.getElementById('mainImage').alt = tutorialTitle;
                    
                    // Construire les images et descriptions à partir des étapes
                    if (tutorial.steps && Array.isArray(tutorial.steps)) {
                        images = tutorial.steps
                            .map(step => getStepVisual(step));
                        
                        stepDescriptions = tutorial.steps
                            .map((step, idx) => {
                                const title = step.title || `Étape ${idx + 1}`;
                                return title;
                            });
                    }
                } catch (error) {
                    console.warn('Erreur lors du chargement des données du tutoriel:', error);
                }
            }
            
            // Si pas de données, utiliser des données par défaut
            if (images.length === 0) {
                images = [
                    'https://via.placeholder.com/800x600?text=Image+1',
                    'https://via.placeholder.com/800x600?text=Image+2',
                    'https://via.placeholder.com/800x600?text=Image+3',
                    'https://via.placeholder.com/800x600?text=Image+4'
                ];
                
                stepDescriptions = [
                    'Étape 1: Démarrage',
                    'Étape 2: Configuration',
                    'Étape 3: Exécution',
                    'Étape 4: Finalisation'
                ];
            }
        }

        let currentIndex = 0;

        function loadImage(index) {
            currentIndex = Math.max(0, Math.min(index, images.length - 1));
            document.getElementById('mainImage').src = images[currentIndex];
            document.getElementById('counter').textContent = `${currentIndex + 1} / ${images.length}`;
            document.getElementById('stepDescription').textContent = stepDescriptions[currentIndex] || `Étape ${currentIndex + 1}`;
            updateButtonVisibility();
            updateThumbnails();
        }

        function updateButtonVisibility() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            // Show previous button only if not at first image
            prevBtn.style.display = currentIndex > 0 ? 'flex' : 'none';
            
            // Show next button only if not at last image
            nextBtn.style.display = currentIndex < images.length - 1 ? 'flex' : 'none';
        }

        function nextImage() {
            if (currentIndex < images.length - 1) {
                loadImage(currentIndex + 1);
            }
        }

        function prevImage() {
            if (currentIndex > 0) {
                loadImage(currentIndex - 1);
            }
        }

        function updateThumbnails() {
            document.querySelectorAll('.thumbnail-list img').forEach((img, i) => {
                img.classList.toggle('active', i === currentIndex);
            });
        }

        function initThumbnails() {
            const container = document.getElementById('thumbnails');
            container.innerHTML = ''; // Clear existing thumbnails
            images.forEach((src, i) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = stepDescriptions[i] || `Étape ${i + 1}`;
                img.onclick = () => loadImage(i);
                container.appendChild(img);
            });
            updateThumbnails();
        }

        // Initialiser au chargement de la page
        loadTutorialData();
        if (images.length > 0) {
            initThumbnails();
            loadImage(0);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });
    </script>
</body>
</html>
