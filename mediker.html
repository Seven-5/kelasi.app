<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediker Gestion Médicale - Connexion QR</title>
    <style>
        /* === Réinitialisation de base === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8; /* Fond bleu-gris très doux */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }

        /* === Conteneur principal (La carte) === */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        /* === En-tête === */
        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0056b3; /* Bleu médical de confiance */
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            color: #7f8c8d;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* === Section Code QR === */
        .qr-container {
            background: #ffffff;
            padding: 15px;
            border-radius: 16px;
            border: 2px dashed #cbd5e1;
            display: inline-block;
            margin-bottom: 25px;
            transition: transform 0.3s ease;
        }

        .qr-container:hover {
            transform: scale(1.02);
            border-color: #0056b3;
        }

        .qr-container img {
            display: block;
            width: 335px;
            height: 335px;
        }

        /* === Message d'instruction === */
        .message {
            font-size: 15px;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 30px;
            padding: 0 15px;
        }

        /* === Boîte des identifiants === */
        .credentials-box {
            background-color: #f8fafc;
            border-left: 4px solid #0056b3;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
        }

        .cred-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .cred-row:first-child {
            padding-top: 0;
        }

        .cred-row:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }

        .label {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }

        .value {
            color: #0f172a;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Mediker</h1>
            <p class="subtitle">Gestion Médicale</p>
        </div>

        <div class="qr-container">
            <!-- Remplacer le lien "src" par l'image de votre vrai code QR si nécessaire -->
            <img src="assets/media/Screenshot_20260616-212724.png" alt="Code QR de connexion">
        </div>

        <div class="message">
            Scannez le code QR depuis votre téléphone et connectez-vous avec les données de connexion fournies.
        </div>

        <div class="credentials-box">
            <div class="cred-row">
                <span class="label">Matricule :</span>
                <span class="value">425402</span>
            </div>
            <div class="cred-row">
                <span class="label">Mot de passe :</span>
                <span class="value">1234</span>
            </div>
        </div>
    </div>

</body>
</html>
